# Production-oriented compose overlay.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Differences from default compose:
# - ASPNETCORE_ENVIRONMENT=Production (no Swagger, no debug endpoints)
# - PostgreSQL and Redis are not exposed on the host
# - API healthcheck enabled

services:
  enterprise-postgres:
    ports: !reset []

  enterprise-redis:
    ports: !reset []

  enterprise-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  tenant-panel:
    depends_on:
      enterprise-api:
        condition: service_healthy

  platform-admin:
    depends_on:
      enterprise-api:
        condition: service_healthy
